services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-hdos-postgres
    environment:
      POSTGRES_DB: atlas_hdos_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - atlas_hdos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_hdos_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas_hdos_postgres_data:

